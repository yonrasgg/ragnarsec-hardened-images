schemaVersion: 2.0.0

metadataTest:
  user: ragnarsec
  workdir: /etc/nginx/modsec
  exposedPorts: ["8443"]

fileExistenceTests:
  - name: 'ModSecurity Module'
    path: '/usr/lib/nginx/modules/ngx_http_modsecurity_module.so'
    shouldExist: true
  - name: 'CRS Setup'
    path: '/etc/nginx/modsec/crs/crs-setup.conf'
    shouldExist: true
  - name: 'Base Rules'
    path: '/etc/nginx/modsec/crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf'
    shouldExist: true

commandTests:
  - name: 'Nginx Version'
    command: 'nginx'
    args: ['-V']
    exitCode: 0
    # ModSecurity usually appears in `nginx -V` output if compiled in, or as module load.
    # We can check verify command output contains "modsecurity" if loaded dynamically?
    # nginx -t might fail without config enabling it. Let's stick to file checks.

schemaVersion: 2.0.0

metadataTest:
  user: ragnarsec
  workdir: /home/ragnarsec
  envVars:
    - key: USER
      value: ragnarsec
    - key: XDG_RUNTIME_DIR
      value: /run/user/1000
    - key: BUILDKIT_HOST
      value: unix:///run/user/1000/buildkit/buildkitd.sock

fileExistenceTests:
  - name: 'BuildKit Daemon'
    path: '/usr/local/bin/buildkitd'
    shouldExist: true
  - name: 'BuildKit Client'
    path: '/usr/local/bin/buildctl'
    shouldExist: true
  - name: 'Runc'
    path: '/usr/bin/runc'
    shouldExist: true
  - name: 'Rootless Entrypoint'
    path: '/usr/local/bin/buildkit-entrypoint.sh'
    shouldExist: true
  - name: 'Shared Runtime Directory'
    path: '/run/user/1000'
    shouldExist: true
    uid: 1000
    gid: 1000

commandTests:
  - name: 'Entrypoint Syntax'
    command: 'sh'
    args: ['-n', '/usr/local/bin/buildkit-entrypoint.sh']
    exitCode: 0
  - name: 'BuildKit Version'
    command: 'buildkitd'
    args: ['--version']
    exitCode: 0
  - name: 'BuildKit Client Version'
    command: 'buildctl'
    args: ['--version']
    exitCode: 0

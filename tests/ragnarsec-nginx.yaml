schemaVersion: 2.0.0
metadataTest:
  user: ragnarsec
  exposedPorts: ["8443"]
fileExistenceTests:
  - name: 'Nginx Config'
    path: '/etc/nginx/nginx.conf'
    shouldExist: true
  - name: 'Site Config'
    path: '/etc/nginx/conf.d/ragnarsec.conf'
    shouldExist: true
  - name: 'Log Directory'
    path: '/var/log/nginx'
    shouldExist: true
  - name: 'Run Directory'
    path: '/run/nginx'
    shouldExist: true
commandTests:
  - name: 'Nginx Version'
    command: 'nginx'
    args: ['-v']
    exitCode: 0
  - name: 'Nginx Config Test'
    command: 'sh'
    args: ['-c', 'openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=example.invalid" -keyout /etc/nginx/tls/server.key -out /etc/nginx/tls/server.crt >/dev/null 2>&1 && nginx -t -c /etc/nginx/nginx.conf']
    exitCode: 0

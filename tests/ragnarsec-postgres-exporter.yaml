schemaVersion: 2.0.0

metadataTest:
  user: "1000:1000"
  workdir: /app
  entrypoint: ["/sbin/tini", "--"]
  exposedPorts: ["9187"]

fileExistenceTests:
  - name: 'Postgres Exporter Binary'
    path: '/usr/bin/postgres_exporter'
    shouldExist: true
  - name: 'No shell'
    path: '/bin/sh'
    shouldExist: false
  - name: 'No package manager'
    path: '/sbin/apk'
    shouldExist: false

commandTests:
  - name: 'Postgres Exporter Version'
    command: 'postgres_exporter'
    args: ['--version']
    exitCode: 0
    expectedError: ['postgres_exporter, version']

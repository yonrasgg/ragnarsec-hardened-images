schemaVersion: 2.0.0
metadataTest:
  user: ragnarsec
  workdir: /app
  envVars:
    - key: VIRTUAL_ENV
      value: /app/venv
    - key: PIP_NO_CACHE_DIR
      value: "1"
    - key: PYTHONDONTWRITEBYTECODE
      value: "1"
    - key: PYTHONUNBUFFERED
      value: "1"
commandTests:
  - name: 'Python Version'
    command: 'python3'
    args: ['--version']
    expectedOutput: ['Python 3']
  - name: 'Pip Version'
    command: 'pip'
    args: ['--version']
    exitCode: 0
  - name: 'SSL Module Available'
    command: 'python3'
    args: ['-c', 'import ssl; print(ssl.OPENSSL_VERSION)']
    exitCode: 0
  - name: 'Venv Python Symlink'
    command: 'python'
    args: ['--version']
    expectedOutput: ['Python 3']
    exitCode: 0
  - name: 'VEX scope: no installed setuptools 70.3.0 and no vendored package index'
    command: 'sh'
    args:
      - '-c'
      - '! find /app /usr/lib/python3.* \( -name "setuptools-70.3.0.dist-info" -o -name "setuptools-70.3.0.egg-info" \) -print -quit | grep -q . && ! find /app /usr/lib/python3.* -path "*pip/_vendor*" -name package_index.py -print -quit | grep -q . && grep -qx "setuptools==70.3.0" /app/venv/lib/python3.*/site-packages/pip/_vendor/vendor.txt'
    exitCode: 0
fileExistenceTests:
  - name: 'Venv Activation'
    path: '/app/venv/bin/activate'
    shouldExist: true
  - name: 'Python Symlink'
    path: '/usr/bin/python'
    shouldExist: true

schemaVersion: 2.0.0

metadataTest:
  user: ragnarsec
  workdir: /app
  envVars:
    - key: VIRTUAL_ENV
      value: /app/venv

fileExistenceTests:
  - name: 'manage.py exists'
    path: '/app/manage.py'
    shouldExist: true
  - name: 'Virtual Env exists'
    path: '/app/venv/bin/python'
    shouldExist: true

commandTests:
  - name: 'Python Version'
    command: 'python3'
    args: ['--version']
    expectedOutput: ['Python 3.12']
  - name: 'Django Check'
    command: '/app/venv/bin/python'
    args: ['manage.py', 'check']
    # Might fail without DB config, but usually checks importability
    # If it fails, we can just check version
  - name: 'Gunicorn Check'
    command: '/app/venv/bin/gunicorn'
    args: ['--version']
    expectedOutput: ['gunicorn']

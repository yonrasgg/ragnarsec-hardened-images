schemaVersion: 2.0.0
metadataTest:
  user: ragnarsec
  workdir: /app
  envVars:
    - key: VIRTUAL_ENV
      value: /app/venv
    - key: PIP_NO_CACHE_DIR
      value: "1"
commandTests:
  - name: 'Python Version'
    command: 'python3'
    args: ['--version']
    expectedOutput: ['Python 3']
    exitCode: 0
  - name: 'Node Version'
    command: 'node'
    args: ['--version']
    expectedOutput: ['v24']
  - name: 'NPM Version'
    command: 'npm'
    args: ['--version']
    exitCode: 0
  - name: 'Make Version'
    command: 'make'
    args: ['--version']
    exitCode: 0
  - name: 'Git Version'
    command: 'git'
    args: ['--version']
    exitCode: 0
  - name: 'Curl Available'
    command: 'curl'
    args: ['--version']
    exitCode: 0
  - name: 'Build Tools Available (gcc)'
    command: 'gcc'
    args: ['--version']
    exitCode: 0
  - name: 'Pinned npm undici is not vulnerable'
    command: 'node'
    args: ['-p', 'require("/usr/local/lib/node_modules/npm/node_modules/undici/package.json").version']
    expectedOutput: ['6.29.1']
    exitCode: 0
  - name: 'VEX scope: no installed setuptools 70.3.0 and no vendored package index'
    command: 'sh'
    args:
      - '-c'
      - '! find /app /usr/lib/python3.* \( -name "setuptools-70.3.0.dist-info" -o -name "setuptools-70.3.0.egg-info" \) -print -quit | grep -q . && ! find /app /usr/lib/python3.* -path "*pip/_vendor*" -name package_index.py -print -quit | grep -q . && grep -qx "setuptools==70.3.0" /app/venv/lib/python3.*/site-packages/pip/_vendor/vendor.txt'
    exitCode: 0
fileExistenceTests:
  - name: 'Venv Activation'
    path: '/app/venv/bin/activate'
    shouldExist: true

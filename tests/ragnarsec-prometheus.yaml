schemaVersion: 2.0.0

metadataTest:
  user: ragnarsec
  workdir: /var/lib/prometheus
  entrypoint: ["/sbin/tini", "--"]
  cmd:
    - prometheus
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/var/lib/prometheus
    - --web.console.libraries=/usr/share/prometheus/console_libraries
    - --web.console.templates=/usr/share/prometheus/consoles

fileExistenceTests:
  - name: 'Prometheus Binary'
    path: '/usr/bin/prometheus'
    shouldExist: true
  - name: 'Prometheus Config'
    path: '/etc/prometheus/prometheus.yml'
    shouldExist: true

commandTests:
  - name: 'Prometheus Version'
    command: 'prometheus'
    args: ['--version']
    exitCode: 0
    expectedOutput: ['prometheus']
  - name: 'Prometheus Bundled Config'
    command: 'promtool'
    args: ['check', 'config', '/etc/prometheus/prometheus.yml']
    exitCode: 0
  - name: 'Reviewed APK Versions'
    command: 'sh'
    args:
      - '-ec'
      - |
        installed="$(apk --no-network --repositories-file /dev/null info -v)"
        for package in apk-tools-3.0.9-r0 libapk-3.0.9-r0 libcrypto3-3.5.9-r1 libssl3-3.5.9-r1 prometheus-3.5.3-r3 zlib-1.4-r0; do
          printf '%s\n' "$installed" | grep -Fx "$package"
        done
    exitCode: 0

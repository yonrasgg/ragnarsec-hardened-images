schemaVersion: 2.0.0

metadataTest:
  user: ragnarsec
  workdir: /app

fileExistenceTests:
  - name: 'server.js exists'
    path: '/app/space/server.js'
    shouldExist: true
  - name: '.next/static exists'
    path: '/app/space/.next/static'
    shouldExist: true

commandTests:
  - name: 'Node Version'
    command: 'node'
    args: ['--version']
    expectedOutput: ['v22']

schemaVersion: 2.0.0

metadataTest:
  user: nginx
  workdir: /var/www/html

fileExistenceTests:
  - name: 'index.html exists'
    path: '/usr/share/nginx/html/index.html'
    shouldExist: true
  - name: 'Custom Nginx Config'
    path: '/etc/nginx/conf.d/default.conf'
    shouldExist: true

commandTests:
  - name: 'Nginx Version'
    command: 'nginx'
    args: ['-v']
  - name: 'Check Config Syntax'
    command: 'nginx'
    args: ['-t']
    exitCode: 0

schemaVersion: 2.0.0
metadataTest:
  exposedPorts: ["80", "81", "443"]
fileExistenceTests:
  - name: 'Application directory'
    path: '/app'
    shouldExist: true
  - name: 'Data directory'
    path: '/data'
    shouldExist: true
  - name: 'Nginx binary (OpenResty bundle)'
    path: '/usr/sbin/nginx'
    shouldExist: true
commandTests:
  # The upstream image leaves Config.User empty; Docker then starts as UID 0.
  # Test the effective default required by s6, not a metadata spelling.
  - name: 'Upstream initialization default UID'
    command: 'id'
    args: ['-u']
    expectedOutput: ['^0[[:space:]]*$']
    exitCode: 0
  - name: 'Nginx version'
    command: 'sh'
    args: ['-c', 'nginx -v']
    exitCode: 0
  - name: 'Node runtime'
    command: 'sh'
    args: ['-c', 'node --version']
    exitCode: 0
  - name: 'No docker socket baked in'
    command: 'sh'
    args: ['-c', 'test ! -S /var/run/docker.sock']
    exitCode: 0

schemaVersion: 2.0.0

metadataTest:
  user: ragnarsec
  workdir: /zap
  envVars:
    - key: ZAP_PATH
      value: /zap/zap.sh

fileExistenceTests:
  - name: 'ZAP Script'
    path: '/zap/zap.sh'
    shouldExist: true
  - name: 'ZAP Entrypoint'
    path: '/usr/local/bin/zap-entrypoint.sh'
    shouldExist: true
  - name: 'Java Runtime'
    path: '/usr/bin/java'
    shouldExist: true

commandTests:
  - name: 'Entrypoint Syntax'
    command: 'sh'
    args: ['-n', '/usr/local/bin/zap-entrypoint.sh']
    exitCode: 0
  - name: 'Entrypoint Requires API Key'
    command: '/usr/local/bin/zap-entrypoint.sh'
    args: []
    exitCode: 1
    expectedError: ['ZAP_API_KEY must be set']
  - name: 'Java Version'
    command: 'java'
    args: ['-version']
    exitCode: 0
  - name: 'Python Version'
    command: 'python3'
    args: ['--version']
    exitCode: 0
  - name: 'ZAP Help'
    command: '/zap/zap.sh'
    args: ['-h']
    exitCode: 0

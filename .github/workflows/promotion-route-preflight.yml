name: Preflight the protected promotion route

"on":
  pull_request_target:
    branches: [development]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: promotion-route-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  simulate:
    name: Simulate the full squash route (no merge authority)
    if: github.repository == 'yonrasgg/ragnarsec-hardened-images'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify the source and protected target
        shell: bash
        env:
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPO" == "$GITHUB_REPOSITORY" && "$SOURCE_BRANCH" == fix/* ]]
          [[ "$BASE_REPO" == "$GITHUB_REPOSITORY" && "$BASE_BRANCH" == development ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out protected policy, never PR code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the current route and print the receipt
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          set -- --source "$SOURCE_BRANCH" --reviewed-head "$PR_HEAD_SHA" \
            --change-id "$PR_NUMBER" --repo "$REPO"
          case "$PR_NUMBER:$SOURCE_BRANCH" in
            '236:fix/ansible-check-publisher-20261126'|\
            '237:fix/staging-draft-app-token-20261126'|\
            '238:fix/actions-reconciliation-preflight-20261126')
              set -- "$@" --approved-reconciliation
              ;;
          esac
          python3 -B tools/jenkins_promotion_route.py "$@"

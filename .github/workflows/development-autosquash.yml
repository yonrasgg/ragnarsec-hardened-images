name: Squash validated fixes into development

"on":
  status:

permissions: {}

concurrency:
  group: development-autosquash-${{ github.event.sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check exact development promotion inputs
    if: >-
      github.repository == 'yonrasgg/ragnarsec-hardened-images' &&
      github.ref == 'refs/heads/main' &&
      github.event.state == 'success' &&
      github.event.sender.id == 356023509 &&
      (github.event.context == 'continuous-integration/jenkins/pr-head' ||
      github.event.context == 'continuous-integration/jenkins/development-plan-binding')
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      plan: ${{ steps.plan.outputs.plan_sha256 }}
    steps:
      - name: Check out the protected default branch policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: plan
        name: Verify read-only Jenkins and GitHub evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/development_autosquash.py

  squash-development:
    needs: preflight
    if: needs.preflight.outputs.plan != '' && vars.RAGNARSEC_AUTO_SQUASH_DEVELOPMENT == 'true'
    permissions:
      contents: write
      pull-requests: read
      statuses: read
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out the same protected default branch policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck and request one ordinary development squash
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.preflight.outputs.plan }}
          RAGNARSEC_AUTO_SQUASH: ${{ vars.RAGNARSEC_AUTO_SQUASH_DEVELOPMENT }}
        run: python3 -B tools/development_autosquash.py --apply-plan "$PLAN"

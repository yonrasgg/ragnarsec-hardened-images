name: Qualify the signed staging transition after PR 264

"on":
  workflow_dispatch:
    inputs:
      pr:
        description: Integrated development pull request
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: Verify signed staging candidate against protected policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the approved workflow context
        shell: bash
        env:
          SOURCE_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = yonrasgg/ragnarsec-hardened-images
          test "$GITHUB_REF" = refs/tags/ragnarsec-staging-pr264-qualify-20261128
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = yonrasgg
          test "$SOURCE_PR" = 264
      - name: Check out the signed qualification tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce the conflict and verify the signed reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-write-fetch-head --no-tags origin \
            refs/heads/development:refs/remotes/origin/development \
            refs/heads/staging:refs/remotes/origin/staging \
            refs/tags/ragnarsec-staging-pr264-qualify-20261128:refs/tags/ragnarsec-staging-pr264-qualify-20261128
          python3 -B tools/qualify_staging_cutover.py

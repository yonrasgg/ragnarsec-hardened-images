name: Qualify promotion policy from a signed test tag

"on":
  workflow_dispatch:
    inputs:
      pr:
        description: Previously reviewed staging pull request for the frozen topology
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: Verify the frozen reconciliation in an isolated repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm the approved test context
        env:
          REVIEWED_PR: ${{ inputs.pr }}
        run: |
          test "$GITHUB_REPOSITORY" = yonrasgg/ragnarsec-hardened-images
          test "$GITHUB_REF" = refs/tags/ragnarsec-promotion-policy-qualify-20261128
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = yonrasgg
          test "$REVIEWED_PR" = 263
      - name: Check out the signed test revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify live refs and simulate both policies
        run: |
          set -euo pipefail
          staging=2add4efdd48e1d579e47158928b9d0cde9bccd97
          main=dfd4b7e9d9a0f0b7fe4cec05fe893d8153c78daa
          expected="$(printf '%s\t%s\n' "$main" refs/heads/main "$staging" refs/heads/staging)"
          current() { git ls-remote --refs origin refs/heads/main refs/heads/staging; }
          test "$(current)" = "$expected"
          git fetch --no-tags --no-write-fetch-head --refmap= origin refs/heads/main:refs/remotes/origin/main refs/heads/staging:refs/remotes/origin/staging
          python3 -B tools/qualify_promotion_policy.py
          test "$(current)" = "$expected"

name: Check staging and main promotion candidates

# Trust boundary (CI-004, post-migration):
#   * Ordinary `pull_request` in this repository, read-only GITHUB_TOKEN, no
#     secret is read; fork or non-standard routes fail closed inside the tool.
#   * The target checkout is the simulation base. For the two pinned legacy
#     bases only, load the evaluator from the immutable policy qualified in
#     Actions run 46173709617 and covered by its owner-signed qualification tag.
#     All other bases use their own protected evaluator.
#   * PR head/base SHAs and refs are event DATA consumed from GITHUB_EVENT_PATH;
#     the candidate tree is simulated from fetched Git objects, never executed.
"on":
  pull_request:
    branches: [staging, main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: verify-promotion-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-promotion:
    name: Verify exact promotion candidate (Actions)
    if: github.repository == 'yonrasgg/ragnarsec-hardened-images'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TRANSITION_POLICY: 326546a32c000ed16abe78767152323770a9e232
    steps:
      # Explicit protected-base checkout: without `ref`, `pull_request` checks
      # out the PR merge commit and the evaluator blocks with
      # trusted-checkout-must-be-the-exact-target.
      - name: Check out protected target policy, never PR code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load the verified policy for the pinned legacy bases
        id: transition
        if: >-
          (github.event.pull_request.base.ref == 'staging' &&
            github.event.pull_request.base.sha == '2add4efdd48e1d579e47158928b9d0cde9bccd97') ||
          (github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.base.sha == 'dfd4b7e9d9a0f0b7fe4cec05fe893d8153c78daa')
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TRANSITION_POLICY }}
          path: .trusted-promotion-policy
          persist-credentials: false
      - name: Simulate this lane without merge or publication authority
        shell: bash
        env:
          TRANSITION_CHECKOUT: ${{ steps.transition.outcome }}
        run: |
          set -euo pipefail
          if [[ "$TRANSITION_CHECKOUT" == success ]]; then
            test "$(git --no-replace-objects -C .trusted-promotion-policy rev-parse HEAD)" = "$TRANSITION_POLICY"
            printf 'Promotion policy: %s\n' "$TRANSITION_POLICY"
            python3 -B .trusted-promotion-policy/tools/promotion_candidate.py "$GITHUB_EVENT_PATH"
          elif [[ "$TRANSITION_CHECKOUT" == skipped ]]; then
            python3 -B tools/promotion_candidate.py "$GITHUB_EVENT_PATH"
          else
            printf 'Unexpected transition checkout outcome: %s\n' "$TRANSITION_CHECKOUT" >&2
            exit 2
          fi

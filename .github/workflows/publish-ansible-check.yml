name: Publish the trusted Ansible check

# This workflow authors the one check run that tools/prepare_staging_draft.py
# trusts after a fix/* PR is squashed into development. The check name, the
# GitHub App ID and the summary format are the exact binding verified by that
# consumer, so they are fixed here rather than read from mutable variables.
"on":
  pull_request:
    branches: [development]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ansible-check-publisher-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exactly one ansible/validate check
    if: >-
      github.repository == 'yonrasgg/ragnarsec-hardened-images' &&
      startsWith(github.event.pull_request.head.ref, 'fix/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # App ID 5929884 is the verified GitHub App ID and the ruleset
      # integration_id bound with strict required checks. Its installation id
      # is 185964213; owner + repositories scopes the token to this repository.
      # The installation token carries Checks: write, while GITHUB_TOKEN stays
      # read-only. The PEM lives only in the Actions secret and never in a file.
      - name: Create the GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0 (v3)
        with:
          app-id: '5929884'
          private-key: ${{ secrets.RAGNARSEC_ANSIBLE_APP_PRIVATE_KEY }}
          owner: yonrasgg
          repositories: ragnarsec-hardened-images

      - name: Publish or update the single trusted check run
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          CHECK_NAME: ansible/validate
          APP_ID: '5929884'
        run: |
          set -euo pipefail

          # Fail closed on anything that is not an in-repository fix/* PR into
          # development. Fork code must never obtain an App token.
          [[ "$REPOSITORY" == 'yonrasgg/ragnarsec-hardened-images' ]]
          [[ "$BASE_REF" == 'development' ]]
          [[ "$HEAD_REPO" == "$REPOSITORY" ]]
          [[ "$HEAD_REF" =~ ^fix/[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          # The parent of the eventual squash is development HEAD at merge
          # time, which is this PR's base.sha at publication time.
          summary="pr=${PR_NUMBER};base=${BASE_SHA};head=${HEAD_SHA}"
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Build the request body without ever interpolating untrusted text
          # into a shell command. The update body omits head_sha because the
          # PATCH endpoint does not accept it.
          build_body() {
            INCLUDE_HEAD="$1" python3 -c '
          import json, os
          body = {
              "name": os.environ["CHECK_NAME"],
              "status": "completed",
              "conclusion": "success",
              "completed_at": os.environ["COMPLETED_AT"],
              "output": {
                  "title": "Ansible validation passed",
                  "summary": os.environ["SUMMARY"],
              },
          }
          if os.environ["INCLUDE_HEAD"] == "yes":
              body["head_sha"] = os.environ["HEAD_SHA"]
          print(json.dumps(body))
          '
          }

          # Enumerate every check on this head, not just the latest one, so a
          # previously published duplicate is detected instead of compounded.
          # gh api -f sends URL-encoded query parameters on a GET request.
          response="$(gh api --hostname github.com \
            "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
            -f check_name="$CHECK_NAME" -f filter=all -f per_page=100)"

          total="$(printf '%s' "$response" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("total_count", 0))')"
          if (( total >= 100 )); then
            echo "::error::check list is incomplete (${total}); refusing to publish" >&2
            exit 1
          fi

          # A trusted check has our exact name, our App id and this exact head.
          ids="$(printf '%s' "$response" | python3 -c '
          import json, os, sys
          runs = json.load(sys.stdin).get("check_runs", [])
          ids = [c["id"] for c in runs
                 if c.get("name") == os.environ["CHECK_NAME"]
                 and (c.get("app") or {}).get("id") == int(os.environ["APP_ID"])
                 and c.get("head_sha") == os.environ["HEAD_SHA"]
                 and type(c.get("id")) is int and c["id"] > 0]
          print("\n".join(str(i) for i in ids))
          ')"

          if [[ -z "$ids" ]]; then
            count=0
          else
            count="$(printf '%s\n' "$ids" | grep -c .)"
          fi

          if (( count == 0 )); then
            build_body yes | gh api --hostname github.com --method POST \
              "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs" --input -
            echo "Published ${CHECK_NAME} for ${HEAD_SHA}."
          elif (( count == 1 )); then
            check_id="$(printf '%s\n' "$ids" | head -n 1)"
            build_body no | gh api --hostname github.com --method PATCH \
              "repos/${REPOSITORY}/check-runs/${check_id}" --input -
            echo "Updated trusted check ${check_id} for ${HEAD_SHA}."
          else
            echo "::error::${count} trusted ${CHECK_NAME} checks exist for ${HEAD_SHA}; refusing to add another" >&2
            exit 1
          fi

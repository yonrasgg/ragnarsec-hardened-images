name: Publish the trusted Ansible check

# The preflight run is a notification. Resolve its PR through the GitHub API
# and verify the receipt with policy from this protected default-branch run.
# The App key belongs exclusively to the main-only ansible-ci environment.
"on":
  workflow_run:
    workflows: ["Preflight the protected promotion route"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ansible-check-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exactly one ansible/validate check
    if: >-
      github.repository == 'yonrasgg/ragnarsec-hardened-images' &&
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.id == 1426336836
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ansible-ci
    steps:
      - name: Check out protected policy for the receipt gate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind the live PR and verify its tree-bound receipt
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          binding="$RUNNER_TEMP/ansible-check-binding.json"
          python3 -B tools/resolve_ansible_check.py > "$binding"
          export HEAD_SHA
          HEAD_SHA="$(jq -er '.head_sha' "$binding")"
          python3 -B tools/ansible_receipt_gate.py \
            --decision-out "$RUNNER_TEMP/ansible-receipt-decision.json"
          python3 -B tools/resolve_ansible_check.py | cmp - "$binding"

      - name: Create the Checks-writing GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: '5929884'
          private-key: ${{ secrets.RAGNARSEC_ANSIBLE_PROTECTED_APP_PRIVATE_KEY }}
          owner: yonrasgg
          repositories: ragnarsec-hardened-images
          permission-checks: write

      - name: Publish or update the single trusted check run
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          CHECK_NAME: ansible/validate
          APP_ID: '5929884'
          DECISION_FILE: ${{ runner.temp }}/ansible-receipt-decision.json
        run: |
          set -euo pipefail
          binding="$RUNNER_TEMP/ansible-check-binding.json"
          PR_NUMBER="$(jq -er '.pr_number' "$binding")"
          export HEAD_SHA
          HEAD_SHA="$(jq -er '.head_sha' "$binding")"
          BASE_SHA="$(jq -er '.base_sha' "$binding")"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -s "$DECISION_FILE" ]]

          # The parent of the eventual squash is development HEAD at merge
          # time, which is this PR's base.sha at publication time.
          summary="pr=${PR_NUMBER};base=${BASE_SHA};head=${HEAD_SHA}"
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Build the request body without ever interpolating untrusted text
          # into a shell command. The update body omits head_sha because the
          # PATCH endpoint does not accept it. The summary remains byte-
          # identical to the previously trusted binding surface.
          build_body() {
            INCLUDE_HEAD="$1" COMPLETED_AT="$completed_at" SUMMARY="$summary" \
            DECISION_FILE="$DECISION_FILE" python3 -c '
          import json, os
          with open(os.environ["DECISION_FILE"], encoding="utf-8") as handle:
              decision = json.load(handle)
          trusted = decision.get("ok") is True
          body = {
              "name": os.environ["CHECK_NAME"],
              "status": "completed",
              "conclusion": "success" if trusted else "failure",
              "completed_at": os.environ["COMPLETED_AT"],
              "output": {
                  "title": decision["title"],
                  "summary": os.environ["SUMMARY"],
                  "text": decision["text"],
              },
          }
          if trusted:
              body["external_id"] = decision["external_id"]
              body["details_url"] = decision["details_url"]
          if os.environ["INCLUDE_HEAD"] == "yes":
              body["head_sha"] = os.environ["HEAD_SHA"]
          print(json.dumps(body))
          '
          }

          # Enumerate every check on this head, not just the latest one, so a
          # previously published duplicate is detected instead of compounded.
          # gh api -f sends URL-encoded query parameters on a GET request.
          # gh api switches to POST when -f/--field is used; --method GET is
          # mandatory here or the check-runs listing returns HTTP 404.
          response="$(gh api --hostname github.com --method GET \
            "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
            -f check_name="$CHECK_NAME" -f filter=all -f per_page=100)"

          total="$(printf '%s' "$response" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("total_count", 0))')"
          if (( total >= 100 )); then
            echo "::error::check list is incomplete (${total}); refusing to publish" >&2
            exit 1
          fi

          # A trusted check has our exact name, our App id and this exact head.
          ids="$(printf '%s' "$response" | python3 -c '
          import json, os, sys
          runs = json.load(sys.stdin).get("check_runs", [])
          ids = [c["id"] for c in runs
                 if c.get("name") == os.environ["CHECK_NAME"]
                 and (c.get("app") or {}).get("id") == int(os.environ["APP_ID"])
                 and c.get("head_sha") == os.environ["HEAD_SHA"]
                 and type(c.get("id")) is int and c["id"] > 0]
          print("\n".join(str(i) for i in ids))
          ')"

          if [[ -z "$ids" ]]; then
            count=0
          else
            count="$(printf '%s\n' "$ids" | grep -c .)"
          fi

          if (( count == 0 )); then
            # Official Checks API: create is POST /repos/{owner}/{repo}/check-runs
            # (head_sha goes in the body); /commits/{ref}/check-runs is GET-only.
            build_body yes | gh api --hostname github.com --method POST \
              "repos/${REPOSITORY}/check-runs" --input -
            echo "Published ${CHECK_NAME} for ${HEAD_SHA}."
          elif (( count == 1 )); then
            check_id="$(printf '%s\n' "$ids" | head -n 1)"
            build_body no | gh api --hostname github.com --method PATCH \
              "repos/${REPOSITORY}/check-runs/${check_id}" --input -
            echo "Updated trusted check ${check_id} for ${HEAD_SHA}."
          else
            echo "::error::${count} trusted ${CHECK_NAME} checks exist for ${HEAD_SHA}; refusing to add another" >&2
            exit 1
          fi
